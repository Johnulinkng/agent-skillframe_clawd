<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lite Agent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f5; display: flex; justify-content: center; height: 100vh; margin: 0; }
    #app { width: 100%; max-width: 800px; display: flex; flex-direction: column; background: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
    .message.user { align-self: flex-end; background: #18181b; color: white; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #f4f4f5; color: #18181b; border-bottom-left-radius: 4px; white-space: pre-wrap; }
    .input-area { padding: 20px; border-top: 1px solid #e4e4e7; display: flex; gap: 10px; background: white; }
    input { flex: 1; padding: 12px; border: 1px solid #e4e4e7; border-radius: 8px; outline: none; font-size: 15px; }
    input:focus { border-color: #18181b; }
    button { padding: 12px 24px; background: #18181b; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app">
    <div id="chat-container"></div>
    <form class="input-area" id="chat-form">
      <input type="text" id="message-input" placeholder="Ask something or use a skill..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    let history = [];

    function addMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      msg.textContent = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage('user', text);
      input.value = '';
      const botMsg = addMessage('assistant', '');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          fullResponse += chunk;
          botMsg.textContent = fullResponse;
          chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: fullResponse });

      } catch (err) {
        botMsg.textContent += `\n[Error: ${err.message}]`;
      }
    };
  </script>
</body>
</html>
